# The committed hook bundles in plugins/claude-code/scripts/dist are what runs on
# every installed machine, and plugin-version.yml ships any change to them. This
# check rebuilds them from scripts/src plus the bundled workspace packages
# (@y/capture, redact, pointers, schema) and fails when the committed bundles
# differ: a hand-edited bundle, or a library fix merged without a rebuild.
# Fix a failure with `pnpm --filter @y/plugin-claude-code build` and commit dist.
#
# This check runs after a push, and the marketplace serves main HEAD, so it
# blocks nothing by itself. It protects installs only when `plugin-dist /
# verify` is a required status check on main and .github/workflows/** plus
# plugins/claude-code/scripts/build.ts need owner review (a pull_request run
# uses the PR's own copy of this file and of build.ts).
name: plugin-dist

on:
  pull_request:
    paths:
      - 'plugins/claude-code/**'
      - 'packages/capture/**'
      - 'packages/redact/**'
      - 'packages/pointers/**'
      - 'packages/schema/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/plugin-dist.yml'
  push:
    paths:
      - 'plugins/claude-code/**'
      - 'packages/capture/**'
      - 'packages/redact/**'
      - 'packages/pointers/**'
      - 'packages/schema/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/plugin-dist.yml'
  # plugin-version.yml calls this before it bumps (and so publishes) a version.
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the plugin and its workspace dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile --filter '@y/plugin-claude-code...'

      - name: Rebuild the hook bundles
        run: pnpm --filter @y/plugin-claude-code build

      - name: Committed bundles must match the rebuild
        run: |
          set -euo pipefail
          dist=plugins/claude-code/scripts/dist
          if ! git diff --exit-code --stat -- "$dist" || [ -n "$(git status --porcelain --untracked-files=all -- "$dist")" ]; then
            git status --porcelain --untracked-files=all -- "$dist"
            echo "::error::$dist does not match a rebuild of plugins/claude-code/src. Run 'pnpm --filter @y/plugin-claude-code build' and commit the result."
            exit 1
          fi
          echo "$dist matches the rebuild"
