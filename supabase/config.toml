# Supabase CLI configuration for the local stack (`supabase start`) and for
# deploying functions. Hosted-project settings are made in the dashboard;
# see README.md for the production checklist. Unlisted settings use the CLI
# defaults.
project_id = "paceline"

[db]
major_version = 17

[realtime]
enabled = true

[functions.embed]
# The embed function authenticates callers with the x-paceline-embed-secret
# header (PACELINE_EMBED_SECRET). Core holds no Supabase JWT for it, so the
# gateway's JWT check is off.
verify_jwt = false
